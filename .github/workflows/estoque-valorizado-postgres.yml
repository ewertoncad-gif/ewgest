name: Verificar estoque valorizado no PostgreSQL
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  estoque-valorizado-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: ewgest_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ewgest_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: teste
      PGDATABASE: ewgest_teste
    steps:
      - uses: actions/checkout@v4
      - name: Preparar cliente PostgreSQL
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Validar estoque por galpão, transferências, consumo e permissões
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/test-estoque-valorizado-postgres.sql
