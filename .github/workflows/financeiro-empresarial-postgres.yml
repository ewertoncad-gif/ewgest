name: Verificar financeiro empresarial no PostgreSQL
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  financeiro-empresarial-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: ewgest_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ewgest_teste"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: teste
      PGDATABASE: ewgest_teste
    steps:
      - uses: actions/checkout@v4
      - name: Preparar cliente PostgreSQL
        run: |
          command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Validar títulos, baixas, estornos e isolamento
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/test-financeiro-empresarial-postgres.sql
      - name: Validar duas baixas simultâneas sem ultrapassar saldo
        shell: bash
        run: |
          set +e
          Q="SET test.uid='00000000-0000-0000-0000-000000000099'; SET test.compra='yes'; SET test.write='yes'; SELECT public.ew_fin_empresa_baixar('00000000-0000-0000-0000-000000000001',(SELECT id FROM public.test_titulo_race),gen_random_uuid(),12000,current_date,'Pix','');"
          psql -X -v ON_ERROR_STOP=1 -c "$Q" >/tmp/baixa-a.log 2>&1 &
          A=$!
          psql -X -v ON_ERROR_STOP=1 -c "$Q" >/tmp/baixa-b.log 2>&1 &
          B=$!
          wait "$A"; RA=$?
          wait "$B"; RB=$?
          set -e
          cat /tmp/baixa-a.log /tmp/baixa-b.log
          if [ "$RA" = 0 ]; then [ "$RB" != 0 ]; grep -q 'Baixa supera o saldo' /tmp/baixa-b.log
          else [ "$RB" = 0 ]; grep -q 'Baixa supera o saldo' /tmp/baixa-a.log; fi
          [ "$(psql -X -At -v ON_ERROR_STOP=1 -c "SELECT sum(valor_centavos) FROM ew_financeiro_interna.baixas WHERE titulo_id=(SELECT id FROM public.test_titulo_race) AND estornado_em IS NULL;")" = "15000" ]
