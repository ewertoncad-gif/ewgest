          grep -Fq 'id="stockObraTransferQty" type="number" min="1" step="1"' "$html"
          grep -Fq 'function stockTransferPrepararQuantidade' "$html"
          grep -Fq "campo.value=inteira?(saldoDisponivel>=1?'1':'')" "$html"
