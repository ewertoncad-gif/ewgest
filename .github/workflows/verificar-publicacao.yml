name: Verificar publicacao do EWGEST

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verificar-publicacao.yml'
      - 'app.html'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Conferir versao na hospedagem (sem autenticar)
        shell: bash
        run: |
          set -euo pipefail
          expected="$(python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('app.html').read_text(encoding='utf-8')
          m = re.search(r'workspaceNavFooter">EWGEST <strong>· (v\d+\.\d+)', s)
          if not m:
              raise SystemExit('Versao nao encontrada no app.html')
          print(m.group(1))
          PY
          )"
          echo "Versao esperada: $expected"
          file="$(mktemp)"
          trap 'rm -f "$file"' EXIT
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location \
              --max-time 15 --retry 0 \
              -H 'Cache-Control: no-cache' \
              "https://ewgest.com.br/app.html?verify=${GITHUB_SHA}" -o "$file"; then
              if grep -Fq "$expected" "$file" && grep -Fq 'id="navRecebimento"' "$file"; then
                echo "PUBLICACAO CONFIRMADA: HTML publico contem $expected e menu Recebimento."
                exit 0
              fi
              echo "Tentativa $attempt: o HTML ainda nao contem a versao esperada."
            else
              echo "Tentativa $attempt: dominio ou pagina nao acessivel."
            fi
            sleep 10
          done
          echo "::error::Nao foi possivel comprovar a versao publicada. Conferir hospedagem/deploy Cloudflare e DNS."
          exit 1

      - name: Conferir arquivos JavaScript do estoque físico
        shell: bash
        run: |
          set -euo pipefail
          js="$(mktemp)"
          receipt="$(mktemp)"
          css="$(mktemp)"
          trap 'rm -f "$js" "$receipt" "$css"' EXIT
          curl --fail --silent --show-error --location --max-time 20 \
            -H 'Cache-Control: no-cache' \
            "https://ewgest.com.br/assets/insumos-fisicos.js?verify=${GITHUB_SHA}" -o "$js"
          curl --fail --silent --show-error --location --max-time 20 \
            -H 'Cache-Control: no-cache' \
            "https://ewgest.com.br/assets/recebimento-manual.js?verify=${GITHUB_SHA}" -o "$receipt"
          curl --fail --silent --show-error --location --max-time 20 \
            -H 'Cache-Control: no-cache' \
            "https://ewgest.com.br/assets/insumos-fisicos.css?verify=${GITHUB_SHA}" -o "$css"
          grep -Fq 'ew_insumos_transferir' "$js"
          grep -Fq 'ew_insumos_receber' "$receipt"
          grep -Fq '.insumosStockTable' "$css"
          echo 'PUBLICACAO CONFIRMADA: scripts e estilo do estoque físico v45.2 disponíveis.'

      - name: Conferir assets publicados da entrega à produção
        shell: bash
        run: |
          set -euo pipefail
          js="$(mktemp)"
          css="$(mktemp)"
          html="$(mktemp)"
          trap 'rm -f "$js" "$css" "$html"' EXIT
          curl --fail --silent --show-error --location --max-time 20 \
            -H 'Cache-Control: no-cache' \
            "https://ewgest.com.br/app.html?verify=${GITHUB_SHA}" -o "$html"
          curl --fail --silent --show-error --location --max-time 20 \
            -H 'Cache-Control: no-cache' \
            "https://ewgest.com.br/assets/entregas-producao.js?verify=${GITHUB_SHA}" -o "$js"
          curl --fail --silent --show-error --location --max-time 20 \
            -H 'Cache-Control: no-cache' \
            "https://ewgest.com.br/assets/entregas-producao.css?verify=${GITHUB_SHA}" -o "$css"
          grep -Fq 'v46.9' "$html"
          grep -Fq 'id="entregasProducaoPanel"' "$html"
          grep -Fq 'Estornar recebimento' "$html"
          grep -Fq 'ew_confirmar_entrega_producao' "$js"
          grep -Fq '#entregasProducaoPanel' "$css"
          echo 'PUBLICACAO CONFIRMADA: v45.3, estorno GN096 e scripts da entrega disponíveis.'

      - name: Conferir romaneios de transferencia entre galpoes publicados
