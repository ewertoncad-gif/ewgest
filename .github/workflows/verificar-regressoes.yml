name: Verificar regras do EWGEST
on:
  push:
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar classificação e regras
        run: node scripts/test-regressoes.mjs
